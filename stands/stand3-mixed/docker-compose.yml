# Stand 3: every state at once.
#   s3-web / s3-client   steady traffic            -> ACTIVE
#   s3-cache / s3-holder open TCP, no data flowing -> CONNECTED (alive, not dead)
#   s3-dead              nothing at all            -> IDLE (dead)
#   s3-finished          exits immediately         -> STOPPED
name: s3-mixed
services:
  web:
    image: nginx:1.27-alpine
    container_name: s3-web
  client:
    image: alpine:3.20
    container_name: s3-client
    depends_on: [web]
    command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web/ ; sleep 2; done"]
  cache:
    image: redis:7-alpine
    container_name: s3-cache
  holder:
    image: alpine:3.20
    container_name: s3-holder
    depends_on: [cache]
    # keeps one TCP connection to redis open without sending anything
    command: ["sh", "-c", "sleep 100000 | nc cache 6379"]
  dead:
    image: alpine:3.20
    container_name: s3-dead
    command: ["sleep", "3600"]
  finished:
    image: alpine:3.20
    container_name: s3-finished
    command: ["true"]
    restart: "no"
