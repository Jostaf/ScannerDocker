# Stand 2: a client polls a web server every 2 s, one container is silent.
# Expected: web and client ACTIVE, silent IDLE.
name: s2-traffic
services:
  web:
    image: nginx:1.27-alpine
    container_name: s2-web
  client:
    image: alpine:3.20
    container_name: s2-client
    depends_on: [web]
    command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web/ ; sleep 2; done"]
  silent:
    image: alpine:3.20
    container_name: s2-silent
    command: ["sleep", "3600"]
